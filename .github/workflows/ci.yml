name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download checksum-pinned Zig
        shell: pwsh
        run: ./download-toolchain.ps1
      - name: Build and run self-tests
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Isolated read-only transport tests
        shell: pwsh
        run: python test_transport.py
      - name: Verify clean release packaging
        shell: pwsh
        run: ./package.ps1
